name: Validate Lumen

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Check Python dependencies
        run: python -m pip check
      - name: Run offline Python tests
        working-directory: .
        run: python -m pytest -q
      - name: Run deterministic CSV and XLSX evaluation
        working-directory: .
        run: |
          python -m evaluation.evaluate
          python -m evaluation.evaluate --format xlsx
      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
